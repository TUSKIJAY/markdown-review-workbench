[package]
name = "markdown-review-workbench"
version = "0.1.0"
description = "Markdown review annotation workbench"
authors = ["Linjing Intelligent"]
edition = "2021"

[lib]
name = "markdown_review_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
